<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Ритм</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/auth.css">
  <script defer src="/api.js"></script><script defer src="/auth.js"></script>
</head>
<body>
  <main class="login-card">
    <div class="brand"><img src="/logo.svg" alt="" width="40" height="40">ритм.</div>
    <div class="switch" role="group" aria-label="Режим">
      <button type="button" id="login-tab" aria-pressed="true">Вход</button>
      <button type="button" id="register-tab" aria-pressed="false">Регистрация</button>
    </div>
    <h1 id="auth-title">С возвращением</h1>
    <form id="auth-form">
      <label id="name-field" hidden>Имя<input name="name" autocomplete="name" maxlength="100" disabled></label>
      <label>Email<input type="email" name="email" autocomplete="username" required maxlength="254"></label>
      <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
      <p id="auth-message" role="status" aria-live="polite"></p>
      <button class="submit" id="auth-submit">Войти</button>
    </form>
  </main>
</body>
</html>
