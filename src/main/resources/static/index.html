<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#203b32"><title>Ритм — задачи и время</title><link rel="icon" type="image/svg+xml" href="/logo.svg?v=1"><link rel="stylesheet" href="/styles.css?v=20261118-1"><script src="/app.js?v=20261118-1" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/"><img class="brand-logo" src="/logo.svg?v=1" alt="" width="40" height="40"><span>ритм<span class="brand-dot">.</span></span></a><p class="sidebar-caption">Рабочее пространство</p><nav aria-label="Разделы"><button data-view="tasks" class="nav active">▦ <span>Мои задачи</span></button><button data-view="calendar" class="nav">▦ <span>Календарь</span></button><button data-view="sessions" class="nav">◷ <span>Учебные сессии</span></button><button data-view="tags" class="nav">◇ <span>Теги</span></button><button data-view="leaders" class="nav">↗ <span>Рейтинг</span></button></nav><div class="sidebar-bottom"><label for="user-select">Текущий пользователь</label><select id="user-select" aria-label="Текущий пользователь"></select><button id="add-user" class="text-button">＋ Создать пользователя</button></div></aside>
<main><header><div><p class="eyebrow" id="date-label"></p><h1 id="page-title">Мои задачи</h1></div><div class="header-actions">
  <label class="timer-style-control" for="timer-style">
    <span>Цвет оформления</span>
    <select id="timer-style">
      <option value="forest">Лес</option>
      <option value="ocean">Океан</option>
      <option value="lavender">Лаванда</option>
      <option value="sunset">Закат</option>
      <option value="rose">Роза</option>
      <option value="graphite">Графит</option>
    </select>
  </label>
  <button id="theme-toggle" class="secondary" type="button" aria-label="Включить тёмную тему" aria-pressed="false">☾ Тёмная тема</button>
  <button id="refresh" class="secondary">↻ Обновить</button>
  <div class="lofi-player" role="group" aria-label="Lofi-плеер">
    <div class="lofi-track"><span class="eyebrow">LOFI RADIO</span><span>Colorful Cat — Asagi</span></div>
    <button id="lofi-toggle" class="secondary" type="button" aria-label="Включить lofi" aria-pressed="false">▶</button>
    <label class="lofi-volume" for="lofi-volume">Громкость <output id="lofi-volume-value">40%</output><input id="lofi-volume" type="range" min="0" max="100" value="40" aria-label="Громкость lofi"></label>
    <audio id="lofi-audio" src="/audio/Colorful%20Cat%20-%20Asagi.mp3" loop preload="none"></audio>
  </div>
</div></header><div id="notice" role="status" hidden></div><section class="stats" aria-label="Статистика"><article><span>Всего задач</span><strong id="stat-total">—</strong><small>в твоём пространстве</small></article><article><span>Завершено</span><strong id="stat-done">—</strong><small>задач выполнено</small></article><article><span>Время фокуса</span><strong id="stat-time">—</strong><small>за всё время</small></article></section>
<section class="focus"><div><span class="eyebrow">ТАЙМЕР</span><h2 id="focus-title">Учебная сессия</h2><p id="focus-description">Выбери направление и начни учебную сессию.</p></div><div class="focus-controls"><p id="pomodoro-status" role="status"></p><strong id="timer" aria-live="off">00:00:00</strong><button id="session-action">▶ Начать сессию</button></div></section>
<section class="workspace"><div class="section-heading"><h2 id="section-title">Список задач</h2><button id="create-button" class="primary">＋ Новая задача</button></div><div id="filters"><input id="search" type="search" placeholder="Поиск по названию…" aria-label="Поиск задач"><select id="status-filter" aria-label="Статус"><option value="">Все статусы</option value="CREATED">Новые</option><option value="IN_PROGRESS">В работе</option><option value="DONE">Завершённые</option></select><select id="tag-filter" aria-label="Тег"><option value="">Все теги</option></select></div><div id="content" aria-live="polite"><div class="empty">Загружаем твоё пространство…</div></div></section></main>
<dialog id="modal"><form id="editor"><div class="modal-heading"><h2 id="modal-title"></h2><button type="button" id="close-modal" class="icon" aria-label="Закрыть">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="modal-actions"><button type="button" id="cancel-modal" class="secondary">Отмена</button><button type="submit" id="save-button" class="primary">Сохранить</button></div></form></dialog>
</body></html>
